name: Build composite & deploy Pages
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pillow
      - name: Restore previous status (keeps last-good timestamps)
        run: curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json" -o site/status.json || true
      - run: python build.py
      - run: rm -f site/bluemarble.jpg site/composite.tmp.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
