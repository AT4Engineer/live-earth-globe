<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Earth – geostationary composite</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#ddd;touch-action:none}
#globe{position:absolute;inset:0}
#panel{position:absolute;top:10px;left:10px;background:rgba(10,15,25,.78);padding:10px 12px;border-radius:10px;font-size:12px;max-width:320px;backdrop-filter:blur(4px)}
#panel h1{font-size:15px;margin:0 0 6px}#panel table{border-collapse:collapse}#panel td{padding:2px 6px 2px 0;vertical-align:top}
.ok{color:#7f7}.bad{color:#f77}button{margin-top:8px;background:#2a6;border:0;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px}
#toggle{position:absolute;top:10px;right:10px;margin:0;background:#334}
</style></head><body>
<div id="globe"></div>
<div id="panel"><h1>🌍 Live Earth (geostationary RGB)</h1>
<div id="ctime">loading…</div><table id="sats"></table>
<button id="refresh">Reload latest</button><div style="opacity:.7;margin-top:4px">Composite rebuilds ~every 15 min.</div>
<div style="margin-top:6px;opacity:.7">Drag to rotate · pinch/scroll to zoom. Imagery: NOAA STAR, CIRA/RAMMB SLIDER (GeoColor). Gaps/poles: NASA Blue Marble.</div></div>
<button id="toggle">Hide panel</button>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
<script>
const g = Globe()(document.getElementById('globe'))
  .globeImageUrl('composite.jpg?t=' + Date.now())
  .bumpImageUrl(null).backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .showAtmosphere(true).atmosphereColor('#7ab').atmosphereAltitude(0.15);
g.controls().autoRotate = false; g.controls().enableDamping = true;
g.pointOfView({lat: 15, lng: -60, altitude: 2.4});
addEventListener('resize', () => g.width(innerWidth).height(innerHeight));
let last = null;
const ago = t => { if(!t) return ''; const m = Math.round((Date.now() - Date.parse(t.split(' ')[0]))/60000); return `${m} min ago`; };
async function poll(){
  try{
    const s = await (await fetch('status.json?' + Date.now())).json();
    document.getElementById('ctime').textContent = 'Composite built: ' + (s.composite_time ? new Date(s.composite_time).toLocaleString() : 'building…');
    document.getElementById('sats').innerHTML = Object.values(s.sats).map(v =>
      `<tr><td class="${v.ok?'ok':'bad'}">${v.ok?'●':'✕'}</td><td>${v.name}</td><td>${v.ok ? v.time.slice(11,16)+'Z<br><span style="opacity:.6">'+ago(v.time)+'</span>' : (v.error||'').slice(0,60)}</td></tr>`).join('');
    if (s.composite_time && s.composite_time !== last){ last = s.composite_time; g.globeImageUrl('composite.jpg?t=' + Date.parse(last)); }
  }catch(e){ document.getElementById('ctime').textContent = 'status error: ' + e; }
}
poll(); setInterval(poll, 60000);
document.getElementById('refresh').onclick = () => poll();
document.getElementById('toggle').onclick = e => { const p = document.getElementById('panel'); const h = p.style.display !== 'none'; p.style.display = h ? 'none' : ''; e.target.textContent = h ? 'Show panel' : 'Hide panel'; };
</script></body></html>
